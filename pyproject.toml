[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-translate"
version = "0.1.0"
dependencies = [
    "pywebview>=4.4",
    "uvicorn[standard]>=0.30",
    "fastapi>=0.110",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "live: tests that call real external APIs (requires .env API key)",
]